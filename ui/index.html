<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Sitio Maharlika Weather</title>
	<link rel="stylesheet" href="style.css">
	<script src="script.js" defer></script>
</head>
<body>
	<div id="temperature"></div>
	<div id="forecast"></div>
	<div id="wind"></div>
	<div id="sync">Sync <span id="sync-status"></span></div>
	<div id="altimeter">
		<div class="altimeter-gauge">
			<div class="altimeter-gauge-label">MSL</div>
			<div class="altimeter-gauge-value"><span id="altitude-sea"></span>m</div>
		</div>
		<div class="altimeter-gauge">
			<div class="altimeter-gauge-label">AGL</div>
			<div class="altimeter-gauge-value"><span id="altitude-terrain"></span>m</div>
		</div>
	</div>

	<div id="admin-ui" aria-hidden="true">
		<div class="shell" role="dialog" aria-labelledby="desk-title" aria-modal="true">
			<div class="sky" id="vs-sky" aria-hidden="true">
				<div class="cloud cloud-a"></div>
				<div class="cloud cloud-b"></div>
				<div class="cloud cloud-c"></div>
				<div class="sun" id="vs-sun"></div>
			</div>

			<header class="topbar">
				<div class="brand">
					<span class="mark" aria-hidden="true">
						<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8">
							<circle cx="12" cy="12" r="4"/>
							<path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/>
						</svg>
					</span>
					<div>
						<p class="eyebrow">Sitio Maharlika</p>
						<h1 id="desk-title">Weather</h1>
					</div>
				</div>
				<span class="pill" id="desk-meta">Sunny</span>
				<button type="button" class="icon-btn" id="admin-ui-close-btn" aria-label="Close weather">
					<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
						<path d="M6 6l12 12M18 6 6 18"/>
					</svg>
				</button>
			</header>

			<nav class="tabs" role="tablist" aria-label="Weather panels">
				<button type="button" class="tab desk-tab is-on" data-tab="weather" role="tab" aria-selected="true" id="tab-weather">Weather</button>
				<button type="button" class="tab desk-tab" data-tab="wind" role="tab" aria-selected="false" id="tab-wind">Wind</button>
			</nav>

			<section class="desk-page is-on" data-page="weather" role="tabpanel" aria-labelledby="tab-weather">
				<div class="clock" id="vs-clock">15:00</div>
				<label class="field-label" for="time-slider">Time of day</label>
				<input id="time-slider" class="slider" type="range" min="0" max="1439" value="900">

				<div class="weathers" id="weather-grid"></div>

				<div class="extras">
					<label class="switch">
						<input type="checkbox" id="time-freeze">
						<span class="knob"></span>
						<span>Freeze time</span>
					</label>
					<label class="switch">
						<input type="checkbox" id="weather-freeze">
						<span class="knob"></span>
						<span>Freeze weather</span>
					</label>
					<label class="switch">
						<input type="checkbox" id="instant-time">
						<span class="knob"></span>
						<span>Instant time</span>
					</label>
					<label class="switch">
						<input type="checkbox" id="instant-weather">
						<span class="knob"></span>
						<span>Instant weather</span>
					</label>
					<label class="switch">
						<input type="checkbox" id="weather-permanent-snow">
						<span class="knob"></span>
						<span>Permanent snow</span>
					</label>
				</div>
			</section>

			<section class="desk-page" data-page="wind" role="tabpanel" aria-labelledby="tab-wind">
				<div class="wind-grid">
					<div class="compass" aria-hidden="true">
						<div class="needle" id="wind-needle"></div>
						<span class="cardinal n">N</span>
						<span class="cardinal e">E</span>
						<span class="cardinal s">S</span>
						<span class="cardinal w">W</span>
					</div>
					<div>
						<div class="field">
							<div class="field-top">
								<label for="wind-dir-slider">Direction</label>
								<strong id="wind-dir-label">0°</strong>
							</div>
							<input id="wind-dir-slider" class="slider" type="range" min="0" max="359" value="0">
						</div>
						<div class="field">
							<div class="field-top">
								<label for="wind-speed-slider">Speed</label>
								<strong id="wind-speed-label">0</strong>
							</div>
							<input id="wind-speed-slider" class="slider" type="range" min="0" max="80" value="0">
						</div>
						<div class="field">
							<div class="field-top">
								<label for="timescale-slider">Timescale</label>
								<strong id="timescale-label">30x</strong>
							</div>
							<input id="timescale-slider" class="slider" type="range" min="1" max="120" value="30">
						</div>
						<div class="field">
							<div class="field-top">
								<label for="sync-slider">Sync delay</label>
								<strong id="sync-label">5000 ms</strong>
							</div>
							<input id="sync-slider" class="slider" type="range" min="500" max="15000" step="100" value="5000">
						</div>
						<label class="switch">
							<input type="checkbox" id="wind-freeze">
							<span class="knob"></span>
							<span>Freeze wind</span>
						</label>
					</div>
				</div>
			</section>

			<div class="actions">
				<p class="credit">Develop By Heavens-c</p>
				<button type="button" id="save-btn" class="btn primary">Save Settings</button>
				<button type="button" id="change-btn" class="btn">Change</button>
			</div>
		</div>
	</div>
</body>
</html>
